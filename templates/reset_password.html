<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global IT Education - Reset Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 50%, #0369a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .main-card {
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            background: #ffffff;
            padding: 40px;
        }
        .form-control {
            background-color: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 11px 15px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }
        .form-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            letter-spacing: 0.5px;
        }
        .btn-submit {
            background-color: #0284c7;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            background-color: #0369a1;
            color: white;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="main-card">
        <div class="text-center mb-4">
            <div class="mb-3">
                <span class="bg-warning-subtle text-warning p-3 rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                    <i class="fa-solid fa-lock fs-3"></i>
                </span>
            </div>
            <h3 class="fw-bold text-dark mb-1">Create New Password</h3>
            <p class="text-muted small">Enter a new secure password for your account.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2 small rounded-3 mb-3 border-0">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/reset-password">
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="position-relative">
                    <input type="password" name="new_password" id="newPass" class="form-control shadow-none pe-5" placeholder="Minimum 6 characters" required minlength="6" autofocus>
                    <i class="fa-regular fa-eye text-muted position-absolute top-50 end-0 translate-middle-y me-3" id="toggleNewPass" style="cursor: pointer; z-index: 10;"></i>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Confirm New Password</label>
                <div class="position-relative">
                    <input type="password" name="confirm_password" id="confirmPass" class="form-control shadow-none pe-5" placeholder="Re-enter new password" required minlength="6">
                    <i class="fa-regular fa-eye text-muted position-absolute top-50 end-0 translate-middle-y me-3" id="toggleConfirmPass" style="cursor: pointer; z-index: 10;"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-submit w-100 shadow-sm mb-3">Reset Password</button>
        </form>
    </div>
</div>

<script>
    function setupToggle(toggleId, inputId) {
        const toggle = document.getElementById(toggleId);
        const input = document.getElementById(inputId);
        if (toggle && input) {
            toggle.addEventListener('click', function () {
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
                input.setAttribute('type', type);
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });
        }
    }
    setupToggle('toggleNewPass', 'newPass');
    setupToggle('toggleConfirmPass', 'confirmPass');
</script>

</body>
</html>
