{% extends "student/base.html" %}
{% block content %}
<div class="container-fluid">
    <h2>Lessons for: {{ course.course_name }}</h2>
    <a href="/student/courses" class="btn btn-secondary mb-3">Back to Courses</a>

    <div class="list-group shadow-sm">
        {% for l in lessons %}
        <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3">
            <div>
                <h5 class="mb-1">Lesson {{ l.display_order }}: {{ l.lesson_title }}</h5>
                <p class="mb-0 text-muted">{{ l.lesson_description }}</p>
            </div>
            <a href="/student/lesson/{{ l.lesson_id }}" class="btn btn-success btn-sm">Start Lesson</a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
