<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global IT Typing Software</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --sidebar-width: 280px;
        }
        body { 
            margin: 0; 
            background-color: #f1f5f9;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            font-size: 1.05rem;
            color: #1e293b;
        }
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            background: #0f172a;
            position: fixed;
            left: 0;
            top: 0;
            padding-top: 24px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 1000;
        }
        .sidebar-top {
            padding: 0 20px;
        }
        .brand-logo {
            max-height: 75px; /* Increased logo size */
            width: auto;
            object-fit: contain;
            background: white;
            padding: 8px 12px;
            border-radius: 10px;
            display: block;
            margin-bottom: 25px;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            color: #cbd5e1;
            text-decoration: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            font-weight: 500;
            border-radius: 10px;
            margin: 6px 0;
            transition: all 0.2s ease;
        }
        .sidebar a:hover {
            background: rgba(2, 132, 199, 0.18);
            color: #38bdf8;
            transform: translateX(4px);
        }
        .sidebar a.active {
            background: #0284c7;
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .sidebar-bottom {
            padding: 20px;
            border-top: 1px solid #1e293b;
        }
        .sidebar-bottom a:hover {
            background: rgba(239, 68, 68, 0.18);
            color: #ef4444 !important;
            transform: translateX(4px);
        }
        .content {
            margin-left: var(--sidebar-width);
            padding: 40px;
            min-height: 100vh;
            max-width: 100%;
        }

        @media (max-width: 992px) {
            :root {
                --sidebar-width: 240px;
            }
            .content {
                padding: 25px;
            }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-top">
        <!-- Logo Image with text fallback -->
        <a href="/admin/dashboard" class="p-0 text-decoration-none bg-transparent">
            <img src="{{ url_for('static', filename='Images/logo.png') }}" alt="Global IT Logo" class="brand-logo" onerror="this.style.display='none'; document.getElementById('fallback-title').style.display='block';">
            <h3 id="fallback-title" class="text-white fw-bold mb-4" style="display:none;">Global IT</h3>
        </a>

        <div class="nav flex-column gap-1">
            <a href="/admin/dashboard" class="{% if request.path == '/admin/dashboard' %}active{% endif %}"><i class="fa-solid fa-gauge-high me-3 fs-5"></i>Dashboard</a>
            <a href="/admin/branches" class="{% if '/admin/branches' in request.path %}active{% endif %}"><i class="fa-solid fa-code-branch me-3 fs-5"></i>Branches</a>
            <a href="/admin/faculty" class="{% if '/admin/faculty' in request.path %}active{% endif %}"><i class="fa-solid fa-chalkboard-user me-3 fs-5"></i>Faculty</a>
            <a href="/admin/students" class="{% if '/admin/students' in request.path %}active{% endif %}"><i class="fa-solid fa-user-graduate me-3 fs-5"></i>Students</a>
            <a href="/admin/lms-content" class="{% if '/admin/lms-content' in request.path %}active{% endif %}"><i class="fa-solid fa-book-open me-3 fs-5"></i>LMS Content</a>
        </div>
    </div>

    <div class="sidebar-bottom">
        <a href="/logout" class="text-danger fw-semibold"><i class="fa-solid fa-right-from-bracket me-3 fs-5"></i>Logout</a>
    </div>
</div>

<div class="content">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
