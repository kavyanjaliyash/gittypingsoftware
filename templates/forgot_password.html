<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Global IT Education - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 50%, #0369a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        }
        .main-card {
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            background: #ffffff;
            padding: 40px;
        }
        .form-control {
            background-color: #ffffff;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 11px 15px;
            font-size: 0.95rem;
        }
        .form-control:focus {
            background-color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }
        .form-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #475569;
            letter-spacing: 0.5px;
        }
        .btn-submit {
            background-color: #0284c7;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            color: white;
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            background-color: #0369a1;
            color: white;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="main-card">
        <div class="text-center mb-4">
            <div class="mb-3">
                <span class="bg-primary-subtle text-primary p-3 rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                    <i class="fa-solid fa-mobile-screen-button fs-3"></i>
                </span>
            </div>
            <h3 class="fw-bold text-dark mb-1">Forgot Password?</h3>
            <p class="text-muted small">Enter your username to receive a 6-digit Mobile OTP.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2 small rounded-3 mb-3 border-0">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/forgot-password">
            <div class="mb-4">
                <label class="form-label">Username / Login ID</label>
                <input type="text" name="username" class="form-control shadow-none" placeholder="Enter username" required autofocus>
            </div>

            <button type="submit" class="btn btn-submit w-100 shadow-sm mb-3">Send Mobile OTP</button>
            
            <div class="text-center">
                <a href="/login" class="text-decoration-none small text-secondary fw-semibold">
                    <i class="fa-solid fa-arrow-left me-1"></i>Back to Login
                </a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
